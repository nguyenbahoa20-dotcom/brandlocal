backend:
  name: turbo-github
  repo: nguyenbahoa20-dotcom/brandlocal
  branch: main
  turbo_site_id: 117f45be-465e-4bc8-bff6-907bbef559dd

media_folder: "public/assets/projects"
public_folder: "/assets/projects"
locale: "vi"

collections:
  - name: "projects"
    label: "Công trình & dự án"
    label_singular: "Thêm công trình"
    description: "Chọn một công trình để sửa hoặc bấm Thêm công trình. Ảnh bìa và album được quản lý ngay trong biểu mẫu."
    folder: "public/content/project-records"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    summary: "{{title}} · {{details.location}} · {{details.completionDate}}"
    sortable_fields:
      - field: "details.sortOrder"
        label: "Thứ tự hiển thị"
        default_sort: asc
      - "title"
      - "details.completionDate"
      - "details.location"
    fields:
      - { label: "Tên công trình", name: "title", widget: "string", required: true, hint: "Tên sẽ hiển thị trên website và dùng tạo tên hồ sơ." }

      - label: "01 · Thông tin cơ bản"
        name: "details"
        widget: "object"
        summary: "{{fields.location}} · {{fields.completionDate}}"
        fields:
          - { label: "Mã công trình (để trống để tự tạo)", name: "id", widget: "string", required: false, hint: "Chỉ cần giữ mã hiện có khi sửa. Công trình mới có thể để trống." }
          - { label: "Danh mục", name: "category", widget: "select", default: "Doanh Nghiệp & Văn Phòng", options: ["Doanh Nghiệp & Văn Phòng", "Nhà Xưởng & Kho Bãi", "Biệt Thự & Nhà Phố", "Chuỗi Bán Lẻ & F&B"] }
          - { label: "Địa điểm", name: "location", widget: "string", hint: "VD: VSIP, Bình Dương" }
          - { label: "Thời gian hoàn thành", name: "completionDate", widget: "string", required: false, hint: "VD: Tháng 04/2024" }
          - { label: "Năm hoàn thành", name: "year", widget: "string", required: false, hint: "VD: 2024" }
          - { label: "Khách hàng / Chủ đầu tư", name: "client", widget: "string", required: false }
          - { label: "Thứ tự hiển thị", name: "sortOrder", widget: "number", value_type: "int", default: 0, hint: "0 để đưa lên đầu danh sách; số lớn hơn sẽ hiển thị phía dưới." }
          - { label: "Đánh dấu công trình nổi bật", name: "isFeatured", widget: "boolean", default: false, required: false }

      - label: "02 · Hình ảnh công trình"
        name: "photos"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Ảnh bìa", name: "image", widget: "image", required: false, hint: "Ảnh đại diện trên thẻ dự án. Chọn ảnh rõ, ngang nếu có." }
          - label: "Album ảnh"
            name: "images"
            widget: "list"
            hint: "Bấm Thêm ảnh vào album để chọn ảnh. Có thể thêm số lượng ảnh tùy ý."
            label_singular: "Thêm ảnh vào album"
            add_to_top: false
            field: { label: "Ảnh công trình", name: "image", widget: "image" }

      - label: "03 · Giới thiệu giải pháp"
        name: "solution"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Quy mô hệ thống", name: "scale", widget: "string", required: false, hint: "VD: 24 camera IP 6MP · Hệ thống WiFi khách hàng" }
          - { label: "Mô tả công trình", name: "description", widget: "text", hint: "Nêu nhu cầu, giải pháp triển khai và lợi ích thực tế." }

      - label: "04 · Thiết bị & điểm nổi bật"
        name: "equipment"
        widget: "object"
        collapsed: true
        fields:
          - label: "Thiết bị / công nghệ"
            name: "technologies"
            widget: "list"
            label_singular: "Thêm thiết bị"
            collapsed: true
            field: { label: "Tên thiết bị / công nghệ", name: "technology", widget: "string" }
          - label: "Điểm nổi bật"
            name: "highlights"
            widget: "list"
            label_singular: "Thêm điểm nổi bật"
            required: false
            collapsed: true
            field: { label: "Nội dung nổi bật", name: "highlight", widget: "string" }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#p3-bg)"/>
  <!-- Villa Floorplan / 3D Layout -->
  <polygon points="140,240 400,100 660,240 400,380" fill="#131C31" stroke="#334155" stroke-width="2"/>
  <polygon points="140,360 400,220 660,360 400,500" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <line x1="140" y1="240" x2="140" y2="360" stroke="#334155" stroke-width="2"/>
  <line x1="400" y1="380" x2="400" y2="500" stroke="#334155" stroke-width="2"/>
  <line x1="660" y1="240" x2="660" y2="360" stroke="#334155" stroke-width="2"/>

  <!-- AP Mesh Wave Radiations -->
  <g transform="translate(400, 220)">
    <circle cx="0" cy="0" r="12" fill="#06B6D4"/>
    <circle cx="0" cy="0" r="45" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="4 2"/>
    <circle cx="0" cy="0" r="85" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 4"/>
    <text x="0" y="-22" fill="#E2E8F0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ARUBA AP22 MESH (TẦNG 2)</text>
  </g>

  <g transform="translate(280, 360)">
    <circle cx="0" cy="0" r="10" fill="#06B6D4"/>
    <circle cx="0" cy="0" r="40" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4 2"/>
    <text x="0" y="24" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">AP SÂN VƯỜN / HỒ BƠI</text>
  </g>

  <g transform="translate(520, 340)">
    <circle cx="0" cy="0" r="10" fill="#06B6D4"/>
    <circle cx="0" cy="0" r="40" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4 2"/>
    <text x="0" y="24" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">AP PHÒNG KHÁCH (TẦNG TRỆT)</text>
  </g>

  <!-- Dome Cameras at Corners -->
  <circle cx="140" cy="240" r="8" fill="#F59E0B" stroke="#0A0F1D" stroke-width="2"/>
  <circle cx="660" cy="240" r="8" fill="#F59E0B" stroke="#0A0F1D" stroke-width="2"/>
  <circle cx="400" cy="100" r="8" fill="#F59E0B" stroke="#0A0F1D" stroke-width="2"/>

  <!-- Info badge -->
  <rect x="250" y="520" width="300" height="42" rx="8" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5"/>
  <text x="400" y="546" fill="#38BDF8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    ROAMING LIỀN MẠCH &lt; 50MS · PHỦ SÓNG 100%
  </text>
</svg>

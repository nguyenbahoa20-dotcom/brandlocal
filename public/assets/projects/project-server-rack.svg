<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="p5-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0F1D"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#p5-bg)"/>

  <!-- 42U Server Rack Graphic Detail -->
  <rect x="220" y="40" width="360" height="520" rx="12" fill="#0B1120" stroke="#334155" stroke-width="3"/>
  <rect x="240" y="60" width="320" height="480" rx="6" fill="#030712"/>

  <!-- Rack Mount Units with cable managers -->
  <!-- Unit 1: Patch Panel Cat6A with tidy color-coded jacks -->
  <rect x="250" y="70" width="300" height="34" rx="4" fill="#1E293B" stroke="#06B6D4" stroke-width="1"/>
  <g fill="#0EA5E9">
    <circle cx="270" cy="87" r="3"/><circle cx="282" cy="87" r="3"/><circle cx="294" cy="87" r="3"/><circle cx="306" cy="87" r="3"/>
    <circle cx="330" cy="87" r="3"/><circle cx="342" cy="87" r="3"/><circle cx="354" cy="87" r="3"/><circle cx="366" cy="87" r="3"/>
    <circle cx="390" cy="87" r="3"/><circle cx="402" cy="87" r="3"/><circle cx="414" cy="87" r="3"/><circle cx="426" cy="87" r="3"/>
    <circle cx="450" cy="87" r="3"/><circle cx="462" cy="87" r="3"/><circle cx="474" cy="87" r="3"/><circle cx="486" cy="87" r="3"/>
    <circle cx="510" cy="87" r="3"/><circle cx="522" cy="87" r="3"/><circle cx="534" cy="87" r="3"/>
  </g>

  <!-- Unit 2: Cable Management Brush Bar -->
  <rect x="250" y="110" width="300" height="24" rx="4" fill="#111827"/>
  <line x1="260" y1="122" x2="540" y2="122" stroke="#475569" stroke-width="4" stroke-dasharray="2 4"/>

  <!-- Unit 3: Cisco 48-Port PoE+ Switch -->
  <rect x="250" y="140" width="300" height="38" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="260" y="156" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8">CISCO CATALYST 48P POE+</text>
  <circle cx="530" cy="155" r="4" fill="#10B981"/>

  <!-- Unit 4: MikroTik Cloud Core Router -->
  <rect x="250" y="184" width="300" height="38" rx="4" fill="#131C31" stroke="#06B6D4" stroke-width="1.5"/>
  <rect x="260" y="194" width="40" height="18" rx="2" fill="#0A0F1D"/>
  <text x="280" y="206" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">CCR</text>
  <circle cx="510" cy="203" r="3" fill="#10B981"/><circle cx="520" cy="203" r="3" fill="#10B981"/><circle cx="530" cy="203" r="3" fill="#38BDF8"/>

  <!-- Unit 5: Hikvision 32CH 4K NVR -->
  <rect x="250" y="228" width="300" height="42" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="260" y="248" fill="#F8FAFC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700">HIKVISION EMBEDDED 4K NVR</text>
  <rect x="470" y="238" width="60" height="12" rx="2" fill="#0A0F1D"/>
  <text x="500" y="247" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">REC: ACTIVE</text>

  <!-- Unit 6: Synology NAS Backup -->
  <rect x="250" y="276" width="300" height="46" rx="4" fill="#131C31" stroke="#334155" stroke-width="1"/>
  <rect x="265" y="284" width="35" height="30" rx="2" fill="#0B1120" stroke="#475569"/>
  <rect x="305" y="284" width="35" height="30" rx="2" fill="#0B1120" stroke="#475569"/>
  <rect x="345" y="284" width="35" height="30" rx="2" fill="#0B1120" stroke="#475569"/>
  <rect x="385" y="284" width="35" height="30" rx="2" fill="#0B1120" stroke="#475569"/>
  <text x="440" y="302" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9">SYNOLOGY RS1221+</text>

  <!-- Unit 7: APC Smart-UPS Online 3000VA -->
  <rect x="250" y="330" width="300" height="70" rx="4" fill="#1E293B" stroke="#06B6D4" stroke-width="1"/>
  <rect x="265" y="345" width="70" height="40" rx="4" fill="#030712"/>
  <text x="300" y="362" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">230V / 50Hz</text>
  <text x="300" y="376" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">BATT: 100%</text>
  <text x="350" y="365" fill="#E2E8F0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700">APC SMART-UPS 3KVA</text>

  <!-- Neatly dressed vertical cable loops -->
  <path d="M245 80C235 150 235 250 245 350" stroke="#06B6D4" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M555 80C565 150 565 250 555 350" stroke="#38BDF8" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- Left/Right callouts -->
  <g transform="translate(60, 180)">
    <text x="0" y="0" fill="#38BDF8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700">CÁP MẠNG ĐI ÂM</text>
    <text x="0" y="18" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">Bấm đầu Cat6A chuẩn T568B</text>
    <text x="0" y="34" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">Đánh nhãn Fluke Networks</text>
  </g>

  <g transform="translate(600, 180)">
    <text x="0" y="0" fill="#38BDF8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700">NGUỒN DỰ PHÒNG</text>
    <text x="0" y="18" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">Lưu điện khi cúp điện &gt; 4h</text>
    <text x="0" y="34" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">Tự động khởi động lại</text>
  </g>
</svg>

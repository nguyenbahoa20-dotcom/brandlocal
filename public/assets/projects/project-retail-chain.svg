<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B132B"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#p4-bg)"/>
  
  <!-- Central Hub to 15 branches VPN WireGuard/IPSec Diagram -->
  <!-- Central HQ -->
  <g transform="translate(400, 280)">
    <circle cx="0" cy="0" r="55" fill="#0E1726" stroke="#06B6D4" stroke-width="2.5"/>
    <rect x="-24" y="-18" width="48" height="36" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="0" y="3" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">HQ HUB</text>
    <text x="0" y="38" fill="#F8FAFC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TRUNG TÂM ĐIỀU HÀNH</text>
  </g>

  <!-- Branch nodes arranged radially -->
  <!-- Branch 1 (District 1) -->
  <g transform="translate(180, 140)">
    <circle cx="0" cy="0" r="32" fill="#131C31" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="0" y="4" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Chi Nhánh Q.1</text>
    <line x1="25" y1="18" x2="165" y2="105" stroke="#06B6D4" stroke-width="2" stroke-dasharray="5 3"/>
  </g>

  <!-- Branch 2 (District 7) -->
  <g transform="translate(620, 140)">
    <circle cx="0" cy="0" r="32" fill="#131C31" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="0" y="4" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Chi Nhánh Q.7</text>
    <line x1="-25" y1="18" x2="-165" y2="105" stroke="#06B6D4" stroke-width="2" stroke-dasharray="5 3"/>
  </g>

  <!-- Branch 3 (Thu Duc) -->
  <g transform="translate(160, 420)">
    <circle cx="0" cy="0" r="32" fill="#131C31" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="0" y="4" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Thủ Đức</text>
    <line x1="25" y1="-18" x2="185" y2="-100" stroke="#06B6D4" stroke-width="2" stroke-dasharray="5 3"/>
  </g>

  <!-- Branch 4 (Binh Duong) -->
  <g transform="translate(640, 420)">
    <circle cx="0" cy="0" r="32" fill="#131C31" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="0" y="4" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Bình Dương</text>
    <line x1="-25" y1="-18" x2="-185" y2="-100" stroke="#06B6D4" stroke-width="2" stroke-dasharray="5 3"/>
  </g>

  <!-- Branch 5 (Bien Hoa) -->
  <g transform="translate(400, 80)">
    <circle cx="0" cy="0" r="30" fill="#131C31" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="0" y="4" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Biên Hòa</text>
    <line x1="0" y1="32" x2="0" y2="140" stroke="#06B6D4" stroke-width="2" stroke-dasharray="5 3"/>
  </g>

  <!-- POS & CCTV centralized tag -->
  <rect x="220" y="520" width="360" height="42" rx="8" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5"/>
  <text x="400" y="546" fill="#38BDF8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    18 ĐIỂM BÁN HÀNG · VPN SITE-TO-SITE &amp; QUẢN LÝ TẬP TRUNG
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B132B"/>
      <stop offset="0.5" stop-color="#1C2541"/>
      <stop offset="1" stop-color="#0A0F1D"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="150" y1="150" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="suit-grad" x1="300" y1="360" x2="300" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg-grad)"/>
  
  <!-- Subtle network grid background -->
  <circle cx="300" cy="300" r="260" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="300" cy="300" r="190" stroke="#0891B2" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="300" cy="300" r="140" fill="url(#glow-grad)"/>
  
  <!-- Network Node constellation lines -->
  <line x1="80" y1="120" x2="180" y2="200" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="180" y1="200" x2="140" y2="340" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="520" y1="140" x2="430" y2="210" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="430" y1="210" x2="480" y2="360" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4"/>

  <circle cx="80" cy="120" r="5" fill="#06B6D4"/>
  <circle cx="180" cy="200" r="4" fill="#38BDF8"/>
  <circle cx="140" cy="340" r="4" fill="#0E7490"/>
  <circle cx="520" cy="140" r="5" fill="#38BDF8"/>
  <circle cx="430" cy="210" r="4" fill="#06B6D4"/>
  <circle cx="480" cy="360" r="4" fill="#0E7490"/>

  <!-- Character / Technician Silhouette -->
  <!-- Body/Shoulders -->
  <path d="M160 560C160 460 210 395 250 375L300 420L350 375C390 395 440 460 440 560L440 600H160V560Z" fill="url(#suit-grad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Collar / Shirt details -->
  <path d="M250 375L300 435L350 375" stroke="#06B6D4" stroke-width="3" stroke-linecap="round"/>
  <path d="M300 435V560" stroke="#0E7490" stroke-width="2"/>

  <!-- Neck -->
  <rect x="275" y="300" width="50" height="85" rx="10" fill="#E2E8F0"/>
  
  <!-- Head & Hair -->
  <ellipse cx="300" cy="260" rx="65" ry="75" fill="#F1F5F9"/>
  <!-- Modern Hair -->
  <path d="M230 240C230 170 260 160 300 160C345 160 375 180 370 235C350 205 320 200 300 205C270 210 245 225 230 240Z" fill="#1E293B"/>
  
  <!-- Clean tech glasses / headset outline -->
  <rect x="252" y="240" width="38" height="26" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="2.5"/>
  <rect x="310" y="240" width="38" height="26" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="2.5"/>
  <path d="M290 252H310" stroke="#06B6D4" stroke-width="2.5"/>
  <path d="M252 250H240M348 250H360" stroke="#06B6D4" stroke-width="2"/>

  <!-- Tech badge / lanyard -->
  <rect x="276" y="470" width="48" height="64" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="300" cy="492" r="10" fill="#06B6D4" fill-opacity="0.4"/>
  <rect x="286" y="512" width="28" height="4" rx="2" fill="#94A3B8"/>
  <rect x="290" y="520" width="20" height="4" rx="2" fill="#64748B"/>
  <path d="M285 410L295 470M315 410L305 470" stroke="#0284C7" stroke-width="2"/>
</svg>

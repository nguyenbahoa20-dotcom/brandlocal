name: Sync project records to website data

on:
  push:
    branches: [main]
    paths:
      - "public/content/project-records/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-project-index
  cancel-in-progress: false

jobs:
  sync-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate website project index
        run: node scripts/build-project-index.mjs

      - name: Commit generated index when changed
        run: |
          if git diff --quiet -- public/content/projects.json; then
            echo "Project index is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/content/projects.json
          git commit -m "chore: sync project index"
          git push
